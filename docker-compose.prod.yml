# Optional production override.
# docker-compose.yml is already production-safe and may be run directly.
# This file forces production application settings for explicit prod deployments.

services:
  backend:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"

  worker:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"

  beat:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
