services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    command: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 --access-logfile - --error-logfile -"
    volumes: []

  worker:
    restart: unless-stopped
    volumes: []

  beat:
    restart: unless-stopped
    volumes: []

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    command: serve -s dist -l 5173
    volumes: []

  nginx:
    restart: unless-stopped
