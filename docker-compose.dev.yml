services:
  backend:
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  worker:
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app

  beat:
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  nginx:
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  frontend_node_modules:
