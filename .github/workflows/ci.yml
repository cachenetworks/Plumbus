name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_URL: http://localhost:8080
      DATABASE_URL: postgresql+psycopg://cinema:cinema@localhost:5432/cinema
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: test-session-secret-test-session-secret-123456
      TOKEN_ENCRYPTION_KEY: test-token-key-test-token-key-1234567890
      COOKIE_SECURE: "false"
      MOCK_PLEX: "true"
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cinema
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m compileall -q app
      - run: ruff check app --ignore E402,E702

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
      - run: docker build --target production -t plumbus-frontend ./frontend
      - run: docker build -t plumbus-backend ./backend
